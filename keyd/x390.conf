equal = f12

# Home row: navigation. ZMK puts HOME/PDN/PUP/END/INS on the right hand.
j = home
k = pagedown
l = pageup
semicolon = end
h = insert

# Lower row: print screen and friends.
n = print
m = scrolllock
comma = pause

# Layer navigation.
tab = layer(numnav)
rightalt = layer(symbol)
capslock = layer(leader)


# --- accent: combining marks ----------------------------------------------
#
# Mirrors ZMK's ACCENT layer (layers.dtsi:207-231). A combining mark is
# typed AFTER its base character: type x, then macron, and get x-bar.
#
# These are the 26 marks the ZMK config enables. keyd renders each as its
# code point directly via its own Unicode table, so unlike ZMK's &uc
# module there is no guess about which input method is running.
#
# NOTE: GTK4 applications with a large XCompose file are known to crash
# when keyd's <Cancel>-prefixed sequences arrive (keyd.scdoc, NOTES).
# If an app dies when you type one of these, that is why.
[accent]

# grave (U+0300)
1 = macro(̀)
# acute (U+0301)
2 = macro(́)
# circumflex (U+0302)
3 = macro(̂)
# tilde (U+0303)
4 = macro(̃)
# macron (U+0304)
5 = macro(̄)
# overline (U+0305)
6 = macro(̅)
# breve (U+0306)
7 = macro(̆)
# dot above (U+0307)
8 = macro(̇)
# diaeresis (U+0308)
9 = macro(̈)
# ring above (U+030A)
0 = macro(̊)
# double acute (U+030B)
q = macro(̋)
# caron (U+030C)
w = macro(̌)
# double grave (U+030F)
e = macro(̏)
# inverted breve (U+0311)
r = macro(̑)
# comma above (U+0313)
t = macro(̓)
# left arrow above (U+20D6)
y = macro(⃖)
# right arrow above (U+20D7)
u = macro(⃗)
# left right arrow above (U+20E1)
i = macro(⃡)
# left harpoon above (U+20D0)
o = macro(⃐)
# right harpoon above (U+20D1)
p = macro(⃑)
# enclosing circle (U+20DD)
a = macro(⃝)
# dot below (U+0323)
s = macro(̣)
# macron below (U+0331)
d = macro(̱)
# long stroke overlay (U+0336)
f = macro(̶)
# short stroke overlay (U+0335)
g = macro(̵)
# long solidus overlay (U+0338)
h = macro(̸)

# Layer navigation.
tab = layer(numnav)
rightalt = layer(symbol)
capslock = layer(leader)


# --- media: volume and brightness ------------------------------------------
#
# ZMK's MEDIA layer (layers.dtsi:112-126) sends Consumer-page keys. keyd can
# emit the standard ones (volume, brightness, mute, playback) but not the
# vendor-specific media keys ZMK lists (C_MEDIA_HOME, C_MEDIA_TV, ...), which
# have no keycode in the Linux input layer. Only the portable subset is bound.
[media]

# Right hand: volume and brightness, as ZMK's top two rows show.
u = volumeup
j = volumedown
i = mute
k = brightnessup
l = brightnessdown
o = nextsong
p = previoussong
semicolon = playpause

# Left hand: the laptop's own ThinkPad special keys, which keyd names directly.
q = kbdillumdown
w = kbdillumup
e = kbdillumtoggle
r = micmute
t = wlan
y = bluetooth

# Layer navigation.
tab = layer(numnav)
rightalt = layer(symbol)
capslock = layer(leader)


# --- leader: the leader key ------------------------------------------------
#
# ZMK's &leader1 (behaviors.dtsi:103-159) buffers a variable-length key
# sequence and fires as soon as the buffer matches a registered sequence.
# keyd cannot buffer - it has only layers and chords - so this is a trie in
# which every interior node costs one layer. The 37 hand-written sequences
# (9 sign-offs, 3 Outlook headings, 25 Greek letters) need 8 interior
# nodes, well inside keyd's 32-layer budget (src/config.h:15).
#
# This is the structure ZMK's leader module gives you for free; here it is
# spelled out. The advantage is that prefix safety is now structural: a
# sequence that is a prefix of another is rejected by the generator, so the
# bug ZMK hit with `mo` (behaviors.dtsi:107) cannot recur.
#
# The 951 generated typst math/emoji names are NOT hosted here - a trie over
# them needs 3151 interior nodes. See the escape hatch below and in the
# header.
[leader]

# Escape hatch into the generated symbol sets (see header). These are the
# two category letters ZMK uses after the leader key: M for math, E for
# emoji (behaviors.dtsi:307-308).
m = layer(leader_math)
e = layer(leader_emoji)

# leader + A ... -> layer [leader_a]
a = layer(leader_a)
# leader + B ... -> layer [leader_b]
b = layer(leader_b)
# leader + C ... -> layer [leader_c]
c = layer(leader_c)
# leader + G ... -> layer [leader_g]
g = layer(leader_g)
# leader + O ... -> layer [leader_o]
o = layer(leader_o)
# leader + T ... -> layer [leader_t]
t = layer(leader_t)
# leader + Y ... -> layer [leader_y]
y = layer(leader_y)

[leader_a]
c = macro(C-b Actions: C-b enter C-S-l)
g = macro(C-b Agenda: C-b enter C-S-l)

[leader_b]
r = macro(Best space regards comma enter Heiko)

[leader_c]
o = macro(Cumps space e space obrigado comma enter Heiko)
u = macro(Cumps comma enter Heiko)

[leader_g]
5 = macro(ς)
a = macro(α)
b = macro(β)
c = macro(χ)
d = macro(δ)
e = macro(ε)
f = macro(φ)
g = macro(γ)
h = macro(η)
i = macro(ι)
k = macro(κ)
l = macro(λ)
m = macro(μ)
n = macro(ν)
o = macro(ο)
p = macro(π)
r = macro(ρ)
s = macro(σ)
t = macro(τ)
u = macro(υ)
v = macro(θ)
w = macro(ω)
x = macro(ξ)
