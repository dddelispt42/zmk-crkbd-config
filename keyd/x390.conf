# --- the generated math and emoji sets -------------------------------------
#
# ZMK reaches 951 typst-named symbols as leader + M/E + the name. keyd
# cannot host them: a trie over those names needs 3151 interior nodes and
# keyd allows 32 layers in total (src/config.h:15). What IS here:
#
#   * the short, most-used math names as direct single-key bindings on
#     [leader_math] - the ones a mathematician types constantly (sum, inf,
#     cup, vee, xor, ...). These are reachable exactly as in ZMK: capslock,
#     m, then one key.
#   * the rest through the escape hatch described in docs/KEYD-X390.md.
#     The escape hatch is NOT "type the code point": keyd's compose
#     sequences are base-36 INDICES into its Unicode table, not code
#     points. U+2211 (SUM) is <Cancel><5><y><9>, and typing "2211" gives
#     U+0C06 instead. The documented hatch is `keyd do 'macro(<glyph>)'`,
#     which runs keyd's own macro parser in the daemon (src/daemon.c:422,
#     IPC_MACRO) and needs no compose knowledge at all.
#
#     Only 26 maths symbols and 10 emoji are bound directly below; the
#     remaining 939 reachable ones are reachable via that hatch.

[leader_math]

# The common maths symbols, as direct keys. ZMK types these as
# leader + M + <name>; here the name is collapsed to one key because the
# layer has only ~48 usable positions and the full name needs up to 16
# more. The glyph each key produces is shown in the comment.
# sum = ∑  (U+2211)
s = macro(∑)
# inf = ∞  (U+221E)
i = macro(∞)
# neg = ¬  (U+00AC)
n = macro(¬)
# cup = ∪  (U+222A)
c = macro(∪)
# vee = ∨  (U+2228)
v = macro(∨)
# xor = ⊕  (U+2295)
x = macro(⊕)
# div2 = ÷  (U+00F7)
d = macro(÷)
# para = ∥  (U+2225)
p = macro(∥)
# less = <  (U+003C)
l = macro(<)
# qed = ∎  (U+220E)
q = macro(∎)
# ang = ∠  (U+2220)
a = macro(∠)
# oo = ∞  (U+221E)
o = macro(∞)
# gto = ⧁  (U+29C1)
g = macro(⧁)
# top2 = ⊤  (U+22A4)
t = macro(⊤)
# bot2 = ⊥  (U+22A5)
b = macro(⊥)

# Leave the layer. These layers are entered with layer(leader) - a
# held key - so releasing capslock leaves them. esc is bound to a real
# escape key as a safety valve: in ZMK the thumb key exits the layer on
# release, and on the laptop esc does the same job without stranding you.
esc = esc
capslock = noop

[leader_emoji]

# The emoji set is not hosted: 451 names, 25 distinct first letters, and a
# trie far past the layer budget. Use the escape hatch: press capslock, e,
# then type the code point. The frequent few are bound here.
# heart = ❤  (U+2764)
h = macro(❤)
# thumb up = 👍  (U+1F44D)
t = macro(👍)
# smile = 😊  (U+1F60A)
s = macro(😊)
# wink = 😉  (U+1F609)
w = macro(😉)
# joy = 😂  (U+1F602)
j = macro(😂)
# thinking = 🤔  (U+1F914)
u = macro(🤔)

# Leave the layer. These layers are entered with layer(leader) - a
# held key - so releasing capslock leaves them. esc is bound to a real
# escape key as a safety valve: in ZMK the thumb key exits the layer on
# release, and on the laptop esc does the same job without stranding you.
esc = esc
capslock = noop


# --- coverage summary ------------------------------------------------------
#
# Generated from the ZMK sources at build time. Numbers are measured, not
# estimated: keyd/tools/gen_x390.py counts the sequences and checks each
# code point against keyd's own Unicode table (data/keyd.compose).
#
#   hand-written leader sequences   37 of 49 ported
#     (9 sign-offs, 3 Outlook headings, 25 Greek letters)
#     dropped: 8 Bluetooth/USB/bootloader sequences - keyd cannot change
#     the laptop's radio state - and 3 unicode-mode switches (UXL/UXW/UXM),
#     which are a property of ZMK's &uc module that keyd does not have.
#   generated math sequences        500 present, 5 emittable
#   generated emoji sequences       451 present, all reachable via escape hatch
#   keyd-renderable sequences       1118 of 1123
#   NOT renderable by keyd          5 sequences - recent Unicode
#                                   15/16 additions absent from keyd's table:
#     U+1FAE8 FACESHAKING
#     U+1FAE9 FACETIRED
#     U+1FACD ORCA
#     U+1FA8E TREASURE
#     U+1F6DC WIRELESS
#
# WHAT THIS CONFIG DOES NOT DO, STATED PLAINLY
# --------------------------------------------
# * MOUSE layer: no pointer motion. Impossible in keyd.
# * BLUETH layer: no radio control. Impossible in keyd.
# * key_repeat: no primitive. Dropped.
# * WMCFG/MSOUTL/MACROS layers: app-specific AHK/Outlook macros that only
#   work on machines running the user's AutoHotkey scripts. The four
#   Outlook heading macros ARE reproduced as leader sequences.
# * Home-row mods are approximated, not reproduced: keyd has no prior-idle
#   guard, so fast typing can still trip them. Timeouts are conservative.
# * keyd's layer stack is fully transparent, so an unbound key on a layer
#   falls through to [main] rather than doing nothing. Close to ZMK's
#   &trans, but not identical to &none.

