[leader_o]
# leader + B ... -> layer [leader_o_b]
b = layer(leader_o_b)
c = macro(Obrigado space e space cumps comma enter Heiko)

[leader_o_b]
j = macro(C-b Objective: C-b enter C-S-l)
r = macro(Obrigado comma enter Heiko)

[leader_t]
b = macro(Thank space you space and space best space regards comma enter Heiko)
h = macro(Thank space you comma enter Heiko space Riemer)
y = macro(Thank space you comma enter Heiko)

