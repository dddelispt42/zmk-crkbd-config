# Seppelit (36 keys) - board-specific settings only.
# Shared settings live in config/common.conf and are merged before this file.

# NOTE: tempest.conf uses the same name, so the two boards are indistinguishable
# when pairing over Bluetooth. Change one of them if that becomes a problem.
CONFIG_ZMK_KEYBOARD_NAME="HeiKey"

CONFIG_ZMK_SLEEP=n

# This board has a pointing device.
CONFIG_ZMK_MOUSE=y

# The PROSPECTOR_* symbols come from the prospector-zmk-module, which is not
# enabled in config/west.yml, so they must stay commented out or the Kconfig
# step aborts the build.
# CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
