# Settings shared by all four keyboards.
#
# This file is NOT auto-discovered by ZMK. It is merged in via `cmake-args` in
# build.yaml, which appends it to the build's CONF_FILE list:
#
#     cmake-args: -DCONF_FILE="<zmk defaults>;config/common.conf;config/<board>.conf"
#
# Zephyr merges conf files left to right with later files overriding earlier
# ones, so per-board files can override anything set here.
#
# Why not a #include? Kconfig fragments are merged, not textually included, and
# do not support include/source directives.
#
# Anything genuinely board-specific belongs in config/<board>.conf instead:
#   CONFIG_ZMK_KEYBOARD_NAME, CONFIG_ZMK_SLEEP, CONFIG_ZMK_MOUSE,
#   CONFIG_ZMK_KSCAN_DEBOUNCE_*, CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE

# --- Bluetooth ---------------------------------------------------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- Battery reporting -------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=120
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- Power / idle ------------------------------------------------------------
CONFIG_ZMK_IDLE_TIMEOUT=900000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# --- Pointing ----------------------------------------------------------------
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- Leader key --------------------------------------------------------------
# The zmk-leader-key module defaults this to 32, and asserts at compile time
# that no single leader behavior exceeds it:
#
#   BUILD_ASSERT(ARRAY_SIZE(leader_sequences_##n) <=
#                CONFIG_ZMK_LEADER_MAX_SEQUENCES, ...)
#
# leader1 already holds 39 sequences (14 sign-off/Outlook + 25 Greek), past the
# default, so the default fails the build. Set well above the current count to
# leave room for more.
#
# Cost: the value sizes one shared array of pointers in the module
#
#   static struct leader_seq_cfg *sequence_candidates[CONFIG_...];
#
# i.e. 4 bytes per slot on this 32-bit target, so 256 slots is ~1 KB of the
# nRF52840's 256 KB RAM. The sequence data itself lives in flash and is sized
# by the real count, not by this value.
#
# Note each sequence also takes a virtual key position, ZMK_KEYMAP_LEN + index,
# allocated via __COUNTER__ across all leader instances. At 256 sequences that
# reaches position ~292, comfortably inside the uint16_t used for binding
# indices.
CONFIG_ZMK_LEADER_MAX_SEQUENCES=256

# --- Unicode input timing -----------------------------------------------------
# The zmk-unicode module queues the whole input sequence as one burst:
#
#   UC_MODE_LINUX  ->  tap(Ctrl+Shift+U), tap(hex digits), tap(Space)
#
# With the module defaults (TAP_MS=5, WAIT_MS=0) the keys are delivered with no
# gap between them, so the trigger chord and the first hex digit can arrive
# together and the input method reads the digit as part of the trigger rather
# than as part of the code. The symptom is the hex digits appearing as ordinary
# text with no character produced.
#
# The module README documents this under "Troubleshooting Kconfig settings":
# "If you experience mangled sequences appearing on the screen, increasing the
# defaults may help."
#
# WAIT_MS is raised from 0 to give a pause between keys; TAP_MS from 5 to 20 so
# each key is held long enough for the input method to register the chord.
# These are only used for unicode input, so the cost is a few tens of ms per
# character typed.
CONFIG_ZMK_UNICODE_TAP_MS=20
CONFIG_ZMK_UNICODE_WAIT_MS=10

# --- ZMK Studio ---------------------------------------------------------------
# Runtime keymap editing over USB/BLE. The keymap already carries a
# &studio_unlock binding on the WMCFG layer; that behavior is gated on
# ZMK_STUDIO (ZMK_BEHAVIOR_STUDIO_UNLOCK depends on it), so it does nothing
# until this is switched on.
#
# Studio also requires each keyboard to expose a zmk,physical-layout WITH a
# `keys` array, and to NOT select the legacy matrix transform:
#
#   USE_PHY_LAYOUTS = DT_HAS_COMPAT_STATUS_OKAY(zmk_physical_layout)
#                     && !DT_HAS_CHOSEN(zmk,matrix_transform)
#   BUILD_ASSERT(!CONFIG_ZMK_STUDIO || USE_PHY_LAYOUTS, "ISSUE FOUND: ...");
#
# corne already satisfied this via upstream's foostan_corne_5col_layout. tempest
# and seppelit now do too, through the <shield>-layouts.dtsi files added
# alongside this change (see the header comment there for the derivation).
#
# Note Studio has no effect on the compiled keymap until a "Restore Stock
# Settings" is done in the app - once a keymap is edited over Studio, later
# .keymap changes are not applied until that reset.
CONFIG_ZMK_STUDIO=y

# Studio speaks over a USB CDC-ACM endpoint; this snippet-less variant works for
# a composite in-tree board + shield, which is what these are.
CONFIG_ZMK_STUDIO_LOCKING=y

