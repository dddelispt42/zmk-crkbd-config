# Corne (CRKBD, 5-column, 36 keys) - board-specific settings only.
# Shared settings live in config/common.conf and are merged before this file.

CONFIG_ZMK_KEYBOARD_NAME="HeiCorne"

# No sleep on this board (CONFIG_ZMK_SLEEP is left at its default of n, so
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT from common.conf has no effect here).
# No pointing device on this board.
# CONFIG_ZMK_MOUSE is not set

CONFIG_ZMK_SLEEP=n

CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
