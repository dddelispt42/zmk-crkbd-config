# Sweep (34 keys) - board-specific settings only.
#
# NOTE ON THE NAME: the file must be called cradio.conf, not sweep.conf, because
# ZMK loads config/<shield>.conf and this board's shields are cradio_left /
# cradio_right. The keymap and layout files are named sweep.* (that is the
# hardware name), but the conf name is dictated by the shield.
#
# Shared settings live in config/common.conf and are merged before this file.

CONFIG_ZMK_KEYBOARD_NAME="HeiSweep"

# This board sleeps (unlike corne/tempest/seppelit), so the
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT set in common.conf takes effect here.
CONFIG_ZMK_SLEEP=y

# This board has a pointing device.
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=6

# CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
