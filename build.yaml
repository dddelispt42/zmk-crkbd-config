# GitHub Actions build matrix for the four keyboards sharing this config.
#
# Each keyboard has one keymap adapter in config/ that selects its board macro
# (ZMK_KB_36 for corne/tempest/seppelit, ZMK_KB_34 for sweep) and includes the
# shared config/include/* files. The shield chosen here decides which .conf and
# .keymap ZMK picks up:
#
#   corne_left/right      -> config/corne.keymap    (36 keys, 5-column CRKBD)
#   tempest_left/right    -> config/tempest.keymap  (36 keys, local shield)
#   seppelit_left/right   -> config/seppelit.keymap (36 keys, local shield)
#   cradio_left/right     -> config/sweep.keymap    (34 keys, upstream shield)
#
# Note the asymmetry: the sweep's shield is named `cradio_*` upstream (the
# hardware is a Sweep, whose ZMK shield is called cradio), but its keymap and
# conf are named `sweep.*` and its keyboard name is "HeiSweep".
---
include:
  # --- corne (5-column CRKBD, 36 keys) --------------------------------
  - board: nice_nano@2.0.0//zmk
    shield: corne_left
  - board: nice_nano@2.0.0//zmk
    shield: corne_right

  # --- tempest (36 keys) ----------------------------------------------
  - board: nice_nano@2.0.0//zmk
    shield: tempest_left
  - board: nice_nano@2.0.0//zmk
    shield: tempest_right

  # --- seppelit (36 keys) ---------------------------------------------
  - board: nice_nano@2.0.0//zmk
    shield: seppelit_left
  - board: nice_nano@2.0.0//zmk
    shield: seppelit_right
  # --- sweep (34 keys) -------------------------------------------------
  - board: nice_nano@2.0.0//zmk
    shield: cradio_left
  - board: nice_nano@2.0.0//zmk
    shield: cradio_right

  # --- utility ---------------------------------------------------------
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
