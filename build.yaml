# GitHub Actions build matrix for the four keyboards sharing this config.
#
# Each keyboard has one keymap adapter in config/ that selects its board macro
# (ZMK_KB_36 for corne/tempest/seppelit, ZMK_KB_34 for sweep) and includes the
# shared config/include/* files. The shield chosen here decides which .conf and
# .keymap ZMK picks up:
#
#   corne_left/right      -> config/corne.keymap    (36 keys, 5-column CRKBD)
#   tempest_left/right    -> config/tempest.keymap  (36 keys, local shield)
#   seppelit_left/right   -> config/seppelit.keymap (36 keys, local shield)
#   cradio_left/right     -> config/sweep.keymap    (34 keys, upstream shield)
#
# Note the asymmetry: the sweep's shield is named `cradio_*` upstream (the
# hardware is a Sweep, whose ZMK shield is called cradio). Its keymap and layout
# files are named sweep.*, but its *config* must be config/cradio.conf because
# ZMK loads config/<shield>.conf.
#
# Shared settings live in config/common.conf and are merged via EXTRA_CONF_FILE.
# EXTRA_CONF_FILE is used rather than CONF_FILE because CONF_FILE would REPLACE
# ZMK's own config/<shield>.conf discovery, whereas EXTRA_CONF_FILE appends.
#
# common.conf deliberately contains only symbols that no board contradicts, and
# each board states its differing symbols explicitly - so the outcome does not
# depend on the relative merge position of common.conf and the board conf.
---
include:
  # --- corne (5-column CRKBD, 36 keys) --------------------------------
  - board: nice_nano@2.0.0//zmk
    shield: corne_left
    cmake-args: -DEXTRA_CONF_FILE=\$ENV{ZMK_CONFIG}/common.conf
  - board: nice_nano@2.0.0//zmk
    shield: corne_right
    cmake-args: -DEXTRA_CONF_FILE=\$ENV{ZMK_CONFIG}/common.conf

  # --- tempest (36 keys) ----------------------------------------------
  - board: nice_nano@2.0.0//zmk
    shield: tempest_left
    cmake-args: -DEXTRA_CONF_FILE=\$ENV{ZMK_CONFIG}/common.conf
  - board: nice_nano@2.0.0//zmk
    shield: tempest_right
    cmake-args: -DEXTRA_CONF_FILE=\$ENV{ZMK_CONFIG}/common.conf

  # --- seppelit (36 keys) ---------------------------------------------
  - board: nice_nano@2.0.0//zmk
    shield: seppelit_left
    cmake-args: -DEXTRA_CONF_FILE=\$ENV{ZMK_CONFIG}/common.conf
  - board: nice_nano@2.0.0//zmk
    shield: seppelit_right
    cmake-args: -DEXTRA_CONF_FILE=\$ENV{ZMK_CONFIG}/common.conf

  # --- sweep (34 keys) -------------------------------------------------
  - board: nice_nano@2.0.0//zmk
    shield: cradio_left
    cmake-args: -DEXTRA_CONF_FILE=\$ENV{ZMK_CONFIG}/common.conf
  - board: nice_nano@2.0.0//zmk
    shield: cradio_right
    cmake-args: -DEXTRA_CONF_FILE=\$ENV{ZMK_CONFIG}/common.conf

  # --- utility ---------------------------------------------------------
  # No shared config: this build only resets settings on the controller.
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
