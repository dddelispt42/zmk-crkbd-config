# Keep docs/LEADER-*.md aligned with the generated .dtsi files.
#
# The triage tool (`just symbols`) edits config/include/leader-*.dtsi directly,
# which is the source of truth for what is enabled. The markdown tables are
# derived from those files, so without this job they would drift the moment
# someone toggles a symbol and forgets to regenerate.
#
# The job regenerates and commits only if something changed. It reads no
# network and touches no code - `--docs-only` parses the committed .dtsi.
name: Leader docs

on:
  workflow_dispatch:
  push:
    paths:
      - "config/include/leader-math.dtsi"
      - "config/include/leader-emoji.dtsi"
      - "scripts/gen_leader_symbols.py"
      - ".github/workflows/leader-docs.yml"

permissions:
  contents: write

# Only one workflow may push at a time.
#
# This job and the draw job both write to the repo and are both triggered by the
# same edit to config/include/leader-*.dtsi. When they overlap, whichever pushes
# second is rejected - which is what broke the draw job, whose
# --force-with-lease push was refused with "stale info" after this job pushed.
# Serialising them (with the SAME group name in draw-keymaps.yml) removes the
# race. cancel-in-progress is false so a queued writer is not dropped.
concurrency:
  group: repo-writers
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit hash, not a tag: zizmor's unpinned-uses policy
      # requires it and the pre-commit hook enforces it. The trailing comment
      # records which release the hash is, the conventional form.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Keep the token out of .git/config: zizmor's artipacked audit warns
          # when credentials are persisted into the workspace. The commit step
          # passes the token to the one `git push` that needs it instead, so it
          # never survives past that command.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Regenerate the leader docs from the .dtsi files
        run: ./scripts/gen_leader_symbols.py --docs-only --offline

      - name: Commit if the docs changed
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          BRANCH="${GITHUB_REF_NAME}"

          if git diff --quiet -- 'docs/LEADER-*.md'; then
            echo "docs already in step with the .dtsi files"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/LEADER-*.md
          # A plain commit that only adds to history. Never amend or force-push:
          # rewriting a published branch is destructive, and it is what made the
          # draw job fail with a stale --force-with-lease.
          git commit -m "chore: regenerate leader symbol docs"

          # Retry once on a non-fast-forward. The concurrency group above should
          # prevent this, but a push can still race with a manual one, and
          # rebasing onto the new tip is safe here because nothing depends on
          # this commit being the tip.
          for attempt in 1 2; do
            # Checkout is on a detached HEAD for push events, so there is no
            # current branch to name. Push HEAD explicitly.
            if git push "$REMOTE" "HEAD:refs/heads/${BRANCH}"; then
              exit 0
            fi
            if [ "$attempt" = 2 ]; then
              echo "push failed twice, giving up" >&2
              exit 1
            fi
            echo "push rejected, rebasing onto the new tip and retrying"
            git fetch "$REMOTE" "$BRANCH"
            git rebase FETCH_HEAD
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
