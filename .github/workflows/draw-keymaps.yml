# Example for using the keymap-drawer ZMK user config workflow
name: Draw ZMK keymaps
# https://github.com/caksoylar/keymap-drawer#setting-up-an-automated-drawing-workflow
on:
  workflow_dispatch:  # can be triggered manually
  push:               # automatically run on changes to following paths
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "boards/shields/*/*.dtsi"
      - "keymap_drawer.config.yaml"
      - "generate_leader_yaml.py"
      - "boards/shields/*/*.json"
      - ".github/workflows/draw-keymaps.yml"
      # - "images/keymap-img/keymap_drawer.config.yaml"
      # - 'boards/*/*/*.keymap'

jobs:
  # Leader-key sequences are behavior properties, so keymap-drawer cannot
  # discover them. Derive per-keyboard virtual-layer YAMLs from config/keymap
  # and commit them, so the draw job below can merge them in.
  #
  # The row shape differs per keyboard (corne has 5 rows, tempest/seppelit have
  # 4) and keymap-drawer validates the leader layers against the physical
  # layout, so each keyboard gets its own file.
  leader-yaml:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Generate leader virtual layers
        run: |
          set -euo pipefail
          for kb in corne tempest seppelit; do
            keymap_file="config/${kb}.keymap"
            [ -f "$keymap_file" ] || continue
            case "$kb" in
              corne)    rows="10 10 10 10 2" ;;
              tempest)  rows="10 10 10 6" ;;
              seppelit) rows="10 10 10 6" ;;
              *)        echo "no row shape known for $kb, skipping"; continue ;;
            esac
            ./generate_leader_yaml.py --source config/keymap --rows $rows \
              --out "config/${kb}-leader.yaml"
          done
      - name: Commit if changed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- 'config/*-leader.yaml'; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add config/*-leader.yaml
            git commit --amend --no-edit
            git push --force-with-lease
          else
            echo "leader YAMLs unchanged"
          fi

  draw:
    needs: leader-yaml
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write  # allow workflow to commit to the repo
    with:
      keymap_patterns: "config/*.keymap"        # path to the keymaps to parse
      # Merge the generated leader layers into each drawing. Keyboards without
      # an entry here simply get no leader layers.
      extra_keymap_yaml: "corne:'config/corne-leader.yaml' tempest:'config/tempest-leader.yaml' seppelit:'config/seppelit-leader.yaml'"
      config_path: "keymap_drawer.config.yaml"  # config file, ignored if not exists
      json_path: "config"
      output_folder: "img"            # path to save produced SVG and keymap YAML files
      parse_args: ""  # map of extra args to pass to `keymap parse`, e.g. "corne:'-l Def Lwr Rse' cradio:''"
      draw_args: ""   # map of extra args to pass to `keymap draw`, e.g. "corne:'-k corne_rotated' cradio:'-k paroxysm'"
      amend_commit: true # amend generated files to commit that produces them
      fail_on_error: true
      debug_mode: false
