# Example for using the keymap-drawer ZMK user config workflow
name: Draw ZMK keymaps
# https://github.com/caksoylar/keymap-drawer#setting-up-an-automated-drawing-workflow
on:
  workflow_dispatch:  # can be triggered manually
  push:               # automatically run on changes to following paths
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "config/include/*"
      - "boards/shields/*/*.dtsi"
      - "keymap_drawer.config.yaml"
      - "boards/shields/*/*.json"
      - ".github/workflows/draw-keymaps.yml"
      # - "images/keymap-img/keymap_drawer.config.yaml"
      # - 'boards/*/*/*.keymap'

# Only one workflow may push at a time.
#
# The draw job and the leader-docs job both write to the repo, and both are
# triggered by the same edit to config/include/leader-*.dtsi. When they overlap,
# whichever pushes second is rejected. Serialising them here (and in
# leader-docs.yml, with the SAME group name) removes the race.
concurrency:
  group: repo-writers
  cancel-in-progress: false

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write  # allow workflow to commit to the repo
    with:
      keymap_patterns: "config/*.keymap"        # path to the keymaps to parse
      # No extra_keymap_yaml: the leader sequences are deliberately not drawn.
      # There are thousands of them now (math symbols and emoji generated from
      # typst's tables), so they would paginate into hundreds of virtual layers.
      # docs/LEADER-SYMBOLS.md documents them instead.
      config_path: "keymap_drawer.config.yaml"  # config file, ignored if not exists
      json_path: "config"
      output_folder: "img"            # path to save produced SVG and keymap YAML files
      parse_args: ""  # map of extra args to pass to `keymap parse`, e.g. "corne:'-l Def Lwr Rse' cradio:''"
      draw_args: ""   # map of extra args to pass to `keymap draw`, e.g. "corne:'-k corne_rotated' cradio:'-k paroxysm'"
      # FALSE, deliberately. With amend_commit the action rewrites the commit
      # that triggered the run and pushes it with --force-with-lease, which
      # fails with "stale info" the moment anything else lands on main first -
      # as happened when the leader-docs job pushed while this job was running.
      #
      # The images are derived artifacts, so they do not need to be folded into
      # the triggering commit. A normal commit is also recoverable: history is
      # only ever added to, never rewritten.
      amend_commit: false
      commit_message: "chore: redraw keymaps"
      fail_on_error: true
      debug_mode: false
